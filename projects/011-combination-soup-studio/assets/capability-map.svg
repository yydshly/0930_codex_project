<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Combination Soup Studio 能力与价值引导图</title><desc id="desc">用品牌活动、产品解释和空间方案三个场景，把已有能力变成可编辑、可比较、可导出的交付。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif}.meta{fill:#93abdf;font-size:16px;letter-spacing:2px}.white{fill:#f1f5ff}.muted{fill:#bdc7dc}.dark{fill:#142038}.blue{fill:#2b55e7}.body{font-size:20px}.small{font-size:17px}</style></defs>
<rect width="1200" height="840" rx="20" fill="#111a2c"/>
<text x="54" y="58" class="meta">RESEARCH / 011 · WEBSITE CASE STUDY</text><text x="54" y="122" class="white" font-size="47" font-weight="700">从交互展示，到业务交付。</text><text x="54" y="166" class="muted body">研究案例能力与原理，用实际任务说明我们的能力和价值。</text>
<rect x="54" y="207" width="1092" height="82" rx="12" fill="#25324d"/><text x="78" y="239" class="meta">研究对象 / COMBINATION SOUP STUDIO</text><text x="78" y="271" class="white body">企业建站 · 品牌设计 · 视频动效 · 3D 互动 · 搜索内容组织</text>
<text x="54" y="337" class="meta">THREE WORKING SCENARIOS / 本项目原创场景</text>
<rect x="54" y="359" width="348" height="252" rx="12" fill="#f4f7fb"/><rect x="426" y="359" width="348" height="252" rx="12" fill="#f4f7fb"/><rect x="798" y="359" width="348" height="252" rx="12" fill="#f4f7fb"/>
<text x="78" y="397" class="blue small">01 / 品牌活动</text><text x="78" y="444" class="dark" font-size="30" font-weight="700">让新品被记住</text><text x="78" y="487" class="dark body">编辑内容 · 切换气质</text><text x="78" y="523" class="dark body">播放动效 · 形成需求</text><text x="78" y="575" class="blue small">价值：看懂活动，明确下一步</text>
<text x="450" y="397" class="blue small">02 / 产品解释</text><text x="450" y="444" class="dark" font-size="30" font-weight="700">让产品被理解</text><text x="450" y="487" class="dark body">旋转观察 · 配色试选</text><text x="450" y="523" class="dark body">展开结构 · 保留配置</text><text x="450" y="575" class="blue small">价值：看清差异，减少猜测</text>
<text x="822" y="397" class="blue small">03 / 空间方案</text><text x="822" y="444" class="dark" font-size="30" font-weight="700">让方案可比较</text><text x="822" y="487" class="dark body">尺度输入 · 区域计算</text><text x="822" y="523" class="dark body">记下方案 · 比较取舍</text><text x="822" y="575" class="blue small">价值：具体评审，留下依据</text>
<rect x="54" y="637" width="1092" height="101" rx="12" fill="#2b55e7"/><text x="80" y="673" fill="#e0e8ff" font-size="16">可带走的结果</text><text x="80" y="713" fill="white" font-size="27" font-weight="700">场景需求单 Markdown  /  事实摘要 JSON  /  场景画面 PNG</text>
<text x="54" y="784" class="muted small">边界：交互可运行；真实预约、支付、施工精度和商业收益需另外接入与验证。</text><text x="54" y="817" fill="#91a5c7" font-size="13">原创研究引导图 · 非原站截图 · 研究快照 2026-10-02 · 未确认原站公开源码库</text>
</svg>
