<text x="671" y="1716" font-size="23" fill="#566d62" font-weight="400">项目上下文</text>
<text x="671" y="1760" font-size="31" fill="#173c33" font-weight="650">规则 + 任务 + 进度</text>
<text x="671" y="1797" font-size="23" fill="#173c33" font-weight="400">读取约束与当前状态</text>
