<text x="1076.0" y="1085" font-size="27" fill="#173c33" font-weight="400">目标循环：执行 → 验证 → 修正 → 达成或停止</text>
<text x="1076.0" y="1138" font-size="27" fill="#173c33" font-weight="400">定时循环：周期检查 → 处理异常 → 必要时叫人</text>
<text x="1076.0" y="1191" font-size="27" fill="#173c33" font-weight="400">Maker–Checker：实现者与检查者分工</text>
<text x="1076.0" y="1244" font-size="27" fill="#173c33" font-weight="400">图式编排：节点、分支、共享状态、回退与人工节点</text>
<text x="1076.0" y="1297" font-size="27" fill="#173c33" font-weight="400">运行器、权限、预算、持久化和恢复需自行接入</text>
