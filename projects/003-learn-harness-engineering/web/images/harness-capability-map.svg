<text x="1140.0" y="1001" font-size="34" fill="#173c33" font-weight="700">循环：组织复杂执行</text>
<rect x="1784.0" y="973" width="144" height="38" rx="19" fill="#e8eee0"/>
<text x="1801.0" y="1000" font-size="22" fill="#315f4c" font-weight="500">需外部接入</text>
