<text x="96" y="1955" font-size="36" fill="#173c33" font-weight="700">逐步构建什么目标</text>
<rect x="96.0" y="1984" width="682.5" height="89" rx="9" fill="#e5ecdc"/>
<text x="118.0" y="2039" font-size="29" fill="#b95531" font-weight="700">01</text>
<text x="179.0" y="2039" font-size="28" fill="#173c33" font-weight="600">Agent 可读的项目</text>
<rect x="804.5" y="1984" width="682.5" height="89" rx="9" fill="#e5ecdc"/>
<text x="826.5" y="2039" font-size="29" fill="#b95531" font-weight="700">02</text>
<text x="887.5" y="2039" font-size="28" fill="#173c33" font-weight="600">有证据的单任务执行</text>
<rect x="1513.0" y="1984" width="682.5" height="89" rx="9" fill="#e5ecdc"/>
<text x="1535.0" y="2039" font-size="29" fill="#b95531" font-weight="700">03</text>
<text x="1596.0" y="2039" font-size="28" fill="#173c33" font-weight="600">可跨会话接续的长任务</text>
<rect x="2221.5" y="1984" width="682.5" height="89" rx="9" fill="#e5ecdc"/>
<text x="2243.5" y="2039" font-size="29" fill="#b95531" font-weight="700">04</text>
<text x="2304.5" y="2039" font-size="28" fill="#173c33" font-weight="600">有边界的自动循环与多 Agent</text>
<text x="96" y="2119" font-size="28" fill="#566d62" font-weight="400">先做好验收与状态，再增加自动化和并行。第四阶段需要接入执行环境，不能靠安装 Skill 自动获得。</text>
<path d="M96 2167 L2904 2167" fill="none" stroke="#cfdbcc" stroke-width="3"/>
<text x="96" y="2225" font-size="38" fill="#173c33" font-weight="700">对你的意义</text>
<text x="1590" y="2225" font-size="38" fill="#173c33" font-weight="700">适合的使用场景</text>
<text x="98" y="2278" font-size="28" fill="#b95531" font-weight="650">少重复解释</text>
<text x="294" y="2278" font-size="28" fill="#173c33" font-weight="400">项目背景与决策留在文件中</text>
<text x="98" y="2322" font-size="28" fill="#b95531" font-weight="650">少返工</text>
<text x="294" y="2322" font-size="28" fill="#173c33" font-weight="400">把“完成”绑定到实际验证</text>
<text x="98" y="2366" font-size="28" fill="#b95531" font-weight="650">能接着做</text>
<text x="294" y="2366" font-size="28" fill="#173c33" font-weight="400">新会话知道做到哪里、下一步是什么</text>
<text x="98" y="2410" font-size="28" fill="#b95531" font-weight="650">可复用</text>
<text x="294" y="2410" font-size="28" fill="#173c33" font-weight="400">把成功做法沉淀成项目流程</text>
<rect x="96" y="2447" width="1408" height="67" rx="8" fill="#e9eee0"/>
<text x="119" y="2490" font-size="28" fill="#315f4c" font-weight="550">你的研究集：统一版本、能力、证据、边界和交付检查。</text>
<text x="1590" y="2280" font-size="28" fill="#173c33" font-weight="400">多天持续开发 · 修复与重构 · 批量迁移</text>
<text x="1590" y="2332" font-size="28" fill="#173c33" font-weight="400">补测试与规范化 · 多角色评审 · 项目研究</text>
<text x="1590" y="2384" font-size="28" fill="#173c33" font-weight="400">简单问答或一次性小任务，可只取轻量模板。</text>
<text x="1590" y="2436" font-size="28" fill="#173c33" font-weight="400">Windows：Node 工具可用，Bash 入口需对应环境。</text>
<text x="1590" y="2490" font-size="25" fill="#b95531" font-weight="550">采用价值看返工、人工介入和真实结果，不看结构分高低。</text>
<rect x="96" y="2550" width="2808" height="48" rx="6" fill="#315f4c"/>
