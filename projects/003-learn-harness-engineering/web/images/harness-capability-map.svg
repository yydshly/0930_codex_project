<text x="1795" y="1760" font-size="31" fill="#fffef9" font-weight="650">读取 + 修改 + 运行</text>
<text x="1795" y="1797" font-size="23" fill="#fffef9" font-weight="400">对项目执行实际操作</text>
<path d="M2271 1753 L2315 1753" fill="none" stroke="#6f8774" stroke-width="3" marker-end="url(#arrow)"/>
