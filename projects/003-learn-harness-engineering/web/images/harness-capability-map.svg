<text x="2024.0" y="475" font-size="27" fill="#173c33" font-weight="400">释审计结果。</text>
<text x="2024.0" y="528" font-size="27" fill="#173c33" font-weight="400">4 个 Node 工具：文件生成 / 结构评分 / HTML 报告 / 结构 Benchmark</text>
