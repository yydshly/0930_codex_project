<text x="2024.0" y="1138" font-size="27" fill="#173c33" font-weight="400">课程 PDF 导出与合并：当前支持 en / zh</text>
<text x="2024.0" y="1191" font-size="27" fill="#173c33" font-weight="400">README 截图 · 课程路径与产物检查</text>
<text x="2024.0" y="1244" font-size="27" fill="#173c33" font-weight="400">GitHub Pages / Release 发布工作流</text>
<text x="2024.0" y="1297" font-size="27" fill="#173c33" font-weight="400">翻译文本修正 · 素材辅助脚本</text>
<path d="M2022.0 1414 L2874.0 1414" fill="none" stroke="#cfdbcc" stroke-width="3"/>
<text x="2024.0" y="1449" font-size="24" fill="#566d62" font-weight="400">服务于课程内容维护，不是业务应用生成器。</text>
<text x="96" y="1580" font-size="38" fill="#173c33" font-weight="700">如何配合 Agent：模型负责理解，工具负责执行，项目负责提供规则与反馈</text>
<text x="96" y="1629" font-size="28" fill="#566d62" font-weight="400">你定义目标与验收；本库帮助组织工作条件；模型、宿主工具和真实业务测试来自你的工作环境。</text>
