<text x="2024.0" y="634" font-size="27" fill="#173c33" font-weight="400">生成规则、任务、进度、交接和 init.sh 五类文件</text>
<text x="2024.0" y="687" font-size="27" fill="#173c33" font-weight="400">基础技术栈与包管理器识别；验证命令可自定义</text>
