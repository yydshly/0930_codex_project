<text x="121" y="1716" font-size="23" fill="#566d62" font-weight="400">你</text>
<text x="121" y="1760" font-size="31" fill="#173c33" font-weight="650">目标与验收条件</text>
<text x="121" y="1797" font-size="23" fill="#173c33" font-weight="400">你要什么、怎样算完成</text>
