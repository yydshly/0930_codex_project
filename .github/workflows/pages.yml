name: Deploy research demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and tests
        run: |
          python scripts/projects.py check
          python -m unittest discover -s tests -v
          node --check projects/013-insightface-retrieval/web/app.js
          node --check projects/001-witr/web/app.js
          node --check projects/001-witr/web/data.js
          node --check projects/011-combination-soup-studio/web/app.js
          node --check projects/011-combination-soup-studio/web/foundry/app.js
          node --check projects/011-combination-soup-studio/web/foundry/planner.js
          node --check projects/011-combination-soup-studio/web/foundry/studio.js
          node --check projects/004-rhythm-drop/web/app.js
          node --check projects/004-rhythm-drop/web/garden/app.js
          node --check projects/004-rhythm-drop/web/garden/ecosystem/app.js
          node --check projects/004-rhythm-drop/web/garden/drift/app.js
          node --check projects/004-rhythm-drop/web/children/app.js
          node --check projects/004-rhythm-drop/web/children/game/app.js
          node --check projects/004-rhythm-drop/web/echo/app.js
          node --test projects/004-rhythm-drop/tests/children.test.mjs
          node --test projects/004-rhythm-drop/tests/playground.test.mjs
          node --test projects/004-rhythm-drop/tests/playground-runtime.test.mjs
          node --test projects/004-rhythm-drop/tests/echo.test.mjs
          node --test projects/004-rhythm-drop/tests/echo-direction.test.mjs
          node --test projects/004-rhythm-drop/tests/echo-emotion.test.mjs
          node --test projects/004-rhythm-drop/tests/echo-runtime.test.mjs
          node --test projects/004-rhythm-drop/tests/timeline.test.mjs
          node --test projects/004-rhythm-drop/tests/stories.test.mjs
          node --test projects/004-rhythm-drop/tests/direction.test.mjs
          node --test projects/004-rhythm-drop/tests/rain.test.mjs
          node --test projects/004-rhythm-drop/tests/works.test.mjs
          node --test projects/004-rhythm-drop/tests/identity.test.mjs
          node --test projects/004-rhythm-drop/tests/team.test.mjs
          node --test projects/004-rhythm-drop/tests/garden.test.mjs
          node --test projects/004-rhythm-drop/tests/ecosystem.test.mjs
          python -m unittest discover -s projects/004-rhythm-drop/tests -p test_drift.py -v
      - name: Validate and build Plush Lab
        run: |
          npm ci --prefix projects/005-plush-lab/tooling
          npm test --prefix projects/005-plush-lab/tooling
          npm run build --prefix projects/005-plush-lab/tooling
      - name: Validate and build Koi Scene Lab
        run: |
          npm ci --prefix projects/007-koi-scene-lab/tooling
          npm test --prefix projects/007-koi-scene-lab/tooling
          npm run build --prefix projects/007-koi-scene-lab/tooling
      - name: Validate Dumpling game study
        run: |
          npm ci --prefix projects/010-dumpling-style-lab/tooling
          npm test --prefix projects/010-dumpling-style-lab/tooling
      - name: Validate Sprite interaction research
        run: |
          npm ci --ignore-scripts --prefix projects/009-sprite-destruction-lab/tooling
          npm test --prefix projects/009-sprite-destruction-lab/tooling
          node --check projects/009-sprite-destruction-lab/web/research.js
          node --check projects/009-sprite-destruction-lab/web/toolbox/demo.js
          python projects/009-sprite-destruction-lab/tooling/package-avatar.py --check
          python projects/009-sprite-destruction-lab/tooling/package-toolbox.py --check
      - name: Validate Black Hole Lab
        run: |
          python projects/012-black-hole-lab/tooling/build-research.py --check
          node --check projects/012-black-hole-lab/web/app.js
          node --check projects/012-black-hole-lab/web/course.js
          node --check projects/012-black-hole-lab/web/narration.js
          node --check projects/012-black-hole-lab/web/physics.js
          node --check projects/012-black-hole-lab/web/model.js
          node --check projects/012-black-hole-lab/web/shaders.js
          node projects/012-black-hole-lab/tooling/verify-model.cjs
      - name: Build all static demos
        run: |
          python -c "from pathlib import Path; import subprocess; [subprocess.run(['node', '--check', str(p)], check=True) for p in Path('projects/015-ai-creative-products/web').rglob('*') if p.suffix in {'.js', '.mjs'}]"
          python scripts/build_site.py
          python projects/009-sprite-destruction-lab/tooling/verify-publication.py --site _site/projects/009-sprite-destruction-lab
          python projects/010-dumpling-style-lab/tooling/verify-publication.py --site _site/projects/010-dumpling-style-lab --report projects/010-dumpling-style-lab/notes/publication-ci-checks.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
