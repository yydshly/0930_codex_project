name: Check project catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalog and generated README
        run: python scripts/projects.py check
      - name: Test project management
        run: python -m unittest discover -s tests -v
